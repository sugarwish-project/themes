<!doctype html>
<html lang="id" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.4/dist/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/asset/maintenance.css">
    <title>Islamic Moonlight Romance - Special For You</title>
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div class="preload">
          <p>Loading...</p>
        </div>
        
        <!-- Background & Efek Langit Malam -->
        <div class="bg">
          <div class="moonlight-glow"></div>
          <div class="stars-container" id="starsContainer"></div>
          <div class="fireflies-container" id="firefliesContainer"></div>
        </div>

        <!-- Halaman Pembuka -->
        <div class="content open">
          <div class="open-text glossy-card">
            <span class="ornament">✦ ☪ ✦</span>
            <h1>
              <span style="margin-left: -2rem">Happy</span><br />
              <span style="margin-left: 2rem">Birthday</span>
            </h1>
             <h2>Alisha Kanza Rahmattullah</h2>
            <h2>My Special Person</h2>
            <p>New dreams, new memories, same happiness.</p>
          </div>
        </div>

        <!-- Navigasi Tombol -->
        <div class="btn-container">
          <div class="btn-blur">
            <button class="btn btn-start show">Klik Disini</button>
            <button class="btn btn-next">Lanjut</button>
            <div class="end-buttons">
              <button class="btn btn-replay">Baca Ulang</button>
              <button class="btn btn-message">Kirim Pesan</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="/asset/maintenance.js"></script>
    <script>
      document.addEventListener('click', function() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
          }
        }
      });
    </script>
  </body>
</html>
