<html lang="en" translate="no">

  <body>
    <div class="preload">

    </div>
    <div class="main" style="background-image: url('/asset/themes/img/The Butterfly Garden BG.webp')">
      <div class="bg-love"></div>
      <div class="elements">
        <img src="/asset/themes/animasi/bg1.webp" class="bg" />
        <div class="butterfly">
          <img src="/asset/themes/animasi/butterfly.webp" />
        </div>
        <img src="/asset/themes/animasi/flower.webp" class="flower" />
      </div>
      <div class="book fs"></div>

      <div class="btn-container">
        <button class="open-btn show">Open</button>
        <div class="nav">
          <button class="prev-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" class="bi bi-arrow-left-short" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5" />

    <script src="s.js"></script>
    <script src="/asset/maintenance.js"></script>
<script>
    document.addEventListener('click', function() {
      const elem = document.documentElement;

      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      }
    });
  </script>
  </body>
