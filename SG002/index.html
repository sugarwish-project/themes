<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Khusus Untukmu ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="terkunci">

    <!-- ========== LAYAR 1: AMPLOP ========== -->
    <div class="layar-amplop" id="layarAmplop">
        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Ketuk amplop untuk membuka pesan">
                <div class="sticker left-top">⭐</div>
                <div class="sticker right-bottom">🎁</div>

                <div class="envelope-back"></div>
                <div class="envelope-message">
                    <h2>Untukmu, Bidadariku!</h2>
                </div>
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
                <div class="seal">❤️</div>
            </div>
            <p class="instruction" id="instruction">Ketuk Amplopnya 👆</p>
        </div>
    </div>

    <!-- ========== LAYAR 2: PESAN (1 LAYAR HP) ========== -->
    <main class="halaman-pesan" id="halamanPesan" hidden>
        <div class="container-1layar">
            <h1 id="judul"></h1>
            <p class="subtitle" id="subtitle"></p>

            <div class="message-box" id="kotakPesan">
                <div id="isiPesan"></div>
                <p class="signature" id="tandaTangan"></p>
                <p class="hint-lewati" id="hintLewati">ketuk kotak ini untuk melewati ✨</p>
            </div>

            <!-- Tombol Pemicu Overlay -->
            <button type="button" class="btn-hadiah" id="btnHadiah" hidden>
                Hadiah Manis 🎁✨
            </button>
        </div>

        <button type="button" class="music-toggle" id="musikToggle" aria-label="Putar atau jeda musik">🎵</button>

        <footer>
            &copy; <span id="tahun">2026</span> Kisah Cinta Kita
        </footer>
    </main>

    <!-- ========== OVERLAY / POP-UP HADIAH & BALAS WA ========== -->
    <div class="overlay-hadiah" id="overlayHadiah" hidden>
        <div class="modal-content">
            <button class="btn-tutup" id="btnTutupOverlay">&times;</button>
            
            <h3 class="overlay-title">Hadiah Manis Spesial ✨</h3>

            <!-- 2 Foto Berjajar -->
            <div class="foto-berjajar">
                <img src="https://rakuryuchi.wordpress.com/wp-content/uploads/2025/11/laras2-1.jpeg" alt="Foto 1">
                <img src="https://rakuryuchi.wordpress.com/wp-content/uploads/2025/11/laras1.jpeg" alt="Foto 2">
            </div>

            <!-- Kolom Kirim/Balas WA -->
            <section class="reply-box-overlay">
                <p class="reply-title">Balas pesanku di sini 💌</p>
                <textarea id="pesanBalasan" rows="3" maxlength="500" placeholder="Tulis balasan manis kamu..."></textarea>
                <p class="notif" id="notif" role="alert"></p>
                <button type="button" class="btn-kirim" id="kirimBtn">Kirim ke WhatsApp 💬</button>
            </section>
        </div>
    </div>

    <audio id="background-music" loop preload="auto">
        <source src="https://github.com/masrahmat-id/romance/raw/main/tiw-niw-niw.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
