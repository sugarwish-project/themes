<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Khusus Untukmu ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="terkunci">

    <!-- ========== LAYAR 1: AMPLOP ========== -->
    <div class="layar-amplop" id="layarAmplop">
        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Ketuk amplop untuk membuka pesan">

                <div class="sticker left-top">⭐</div>
                <div class="sticker right-bottom">🎁</div>

                <div class="envelope-back"></div>
                <div class="envelope-message">
                    <h2>Untukmu, Bidadariku!</h2>
                    <p>Ayo, buka! Ada pesan istimewa menantimu!</p>
                </div>
                <div class="envelope-front"></div>
                <div class="envelope-flap"></div>
                <div class="seal">❤️</div>
            </div>
            <p class="instruction" id="instruction">Ketuk Amplopnya 👆</p>
        </div>
    </div>

    <!-- ========== LAYAR 2: PESAN ========== -->
    <main class="halaman-pesan" id="halamanPesan" hidden>
        <div class="container">
            <h1 id="judul"></h1>
            <p class="subtitle" id="subtitle"></p>

            <div class="message-box" id="kotakPesan">
                <div id="isiPesan"></div>
                <p class="signature" id="tandaTangan"></p>
                <p class="hint-lewati" id="hintLewati">ketuk kotak ini untuk melewati ✨</p>
            </div>

            <!-- Muncul pelan-pelan setelah teks selesai diketik -->
            <section class="reply-box" id="replyBox" hidden>
                <p class="reply-title">Balas pesanku, dong 💌</p>
                <textarea id="pesanBalasan" rows="4" maxlength="500"
                          placeholder="Tulis balasanmu di sini..."
                          aria-label="Kolom balasan pesan"></textarea>
                <p class="notif" id="notif" role="alert"></p>
                <button type="button" class="btn-kirim" id="kirimBtn">Kirim pesan 💌</button>
            </section>

            <div class="title-photos">Photos 📸</div>
            <div class="gallery" id="galeri">
                <img src="https://rakuryuchi.wordpress.com/wp-content/uploads/2025/11/laras2-1.jpeg" alt="Foto Kenangan 1" loading="lazy">
                <img src="https://rakuryuchi.wordpress.com/wp-content/uploads/2025/11/laras1.jpeg" alt="Foto Kenangan 2" loading="lazy">
            </div>
        </div>

        <button type="button" class="music-toggle" id="musikToggle" aria-label="Putar atau jeda musik">🎵</button>

        <footer>
            &copy; <span id="tahun">2025</span> Kisah Cinta Kita
        </footer>
    </main>

    <audio id="background-music" loop preload="auto">
        <source src="https://github.com/masrahmat-id/romance/raw/main/tiw-niw-niw.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script src="script.js"></script>
</body>
</html>
