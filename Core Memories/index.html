<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just For You ✨</title>
    <!-- Google Fonts: Plus Jakarta Sans, Playfair Display, Caveat & Young Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/asset/maintenance.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="s.css" />
  </head>
  <body>
    <!-- Preloader -->
    <div class="preloader" id="preloader">
      <div class="loader-heart"></div>
      <p>Menyiapkan kejutan...</p>
    </div>

    <!-- Floating Ambient Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Scrapbook Notebook Container -->
    <main class="notebook-wrapper">
      <!-- Spiral Binder Header -->
      <header class="binder-header">
        <div class="spiral-rings" id="spiral-rings"></div>
        <div class="header-meta">
          <span class="badge">Special Note</span>
          <button class="music-toggle hidden" id="music-toggle" title="Putar / Jeda Musik">
            <span class="equalizer">
              <i></i><i></i><i></i>
            </span>
            <span class="music-label">Playing</span>
          </button>
        </div>
      </header>

      <!-- Lined Paper Body -->
      <section class="paper-body">
        <!-- Stage 1: Intro Envelope / Heart Trigger -->
        <div class="intro-stage" id="intro-stage">
          <div class="heart-trigger" id="heart-btn" role="button" tabindex="0" aria-label="Buka Pesan">
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay"></div>
            <img src="/asset/themes/animasi/love-coklat.svg" alt="Love Icon" />
          </div>
          <h1 class="intro-title">Ada sesuatu buat kamu</h1>
          <p class="intro-subtitle">Ketuk ikon hati di atas untuk membuka</p>
        </div>

        <!-- Stage 2: Interactive Polaroid Card Stack -->
        <div class="cards-stage hidden" id="cards-stage">
          <!-- Progress Dots -->
          <div class="progress-dots" id="progress-dots"></div>

          <!-- Stack Container -->
          <div class="card-stack" id="card-stack"></div>

          <!-- Action Controls -->
          <div class="controls">
            <button class="btn btn-primary" id="btn-next">
              <span>Lanjut</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
            <button class="btn btn-accent hidden" id="btn-send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
              <span>Kirim Balasan</span>
            </button>
            <button class="btn btn-secondary hidden" id="btn-restart">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
              </svg>
              <span>Ulangi</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="s.js"></script>
    <script src="/asset/maintenance.js"></script>
<script>
    document.addEventListener('click', function() {
      const elem = document.documentElement;

      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      }
    });
  </script>
  </body>
</html>
